<VirtualHost *:80>
    ServerName atom.airforce
    DocumentRoot /srv/atom.airforce/www
    DirectoryIndex index.html

    <Directory /srv/atom.airforce/www>
        Options None
        AllowOverride None
        Require all granted

        <LimitExcept GET HEAD>
            Require all denied
        </LimitExcept>
    </Directory>

    # Do not expose dotfiles or editor backup files from the public directory.
    <FilesMatch "^\.|~$">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"

    ErrorLog ${APACHE_LOG_DIR}/atom.airforce-error.log
    CustomLog ${APACHE_LOG_DIR}/atom.airforce-access.log combined
</VirtualHost>
